<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VALORANT Companion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #0f1115;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #9ca3af; max-width: 420px; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #ff4655;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn:hover { background: #e13e4c; }
    .secondary {
      margin-top: 16px;
      font-size: 0.85rem;
    }
    .secondary a { color: #4da3ff; }
  </style>
</head>
<body>
  <h1 id="status">Opening the Companion App…</h1>
  <p id="detail">If nothing happens in a few seconds, click the button below.</p>

  <a id="launchBtn" class="btn" href="#">Open Companion App</a>

  <div class="secondary">
    Don't have it yet?
    <a href="https://github.com/axsokool/valorant-companion/releases/latest">
      Download the latest release
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const protocolUrl = code
      ? `valorantcompanion://link?code=${encodeURIComponent(code)}`
      : "valorantcompanion://open";

    const launchBtn = document.getElementById("launchBtn");
    launchBtn.href = protocolUrl;

    /*
     * Attempt an automatic launch. Some browsers require an actual
     * user gesture (a real click) before allowing navigation to a
     * custom protocol, so this may silently do nothing — the
     * visible button above is the reliable fallback either way.
     */
    window.location.href = protocolUrl;

    if (code) {
      document.getElementById("detail").textContent =
        "Linking your Discord account to the companion app…";
    }
  </script>
</body>
</html>
